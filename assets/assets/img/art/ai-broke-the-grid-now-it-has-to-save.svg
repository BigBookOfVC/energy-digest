<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An ensemble of forecast paths fanning out from a single point">
