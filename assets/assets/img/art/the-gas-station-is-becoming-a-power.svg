<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A forecourt battery feeding power both ways">
        <defs><linearGradient id="the-gas-station-is-becoming-a-power-g4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9CC6F"/><stop offset=".48" stop-color="#12756E"/>
          <stop offset="1" stop-color="#0B3F4A"/></linearGradient></defs>
        <rect width="800" height="600" fill="url(#the-gas-station-is-becoming-a-power-g4)"/>
        <!-- forecourt canopy -->
        <g fill="#100F0D" opacity=".24">
          <rect x="120" y="180" width="560" height="34" rx="6"/>
          <rect x="152" y="214" width="18" height="230"/>
          <rect x="630" y="214" width="18" height="230"/>
        </g>
        <!-- the box -->
        <g>
          <rect x="330" y="300" width="140" height="180" rx="12" fill="#F7EFE7" opacity=".9"/>
          <rect x="356" y="330" width="88" height="10" rx="5" fill="#12756E"/>
          <rect x="356" y="352" width="88" height="10" rx="5" fill="#12756E" opacity=".7"/>
          <rect x="356" y="374" width="58" height="10" rx="5" fill="#12756E" opacity=".45"/>
        </g>
        <!-- two-way arrows -->
        <g stroke="#F7EFE7" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8">
          <path d="M300 390 L200 390"/><path d="M224 372 L200 390 L224 408"/>
          <path d="M500 420 L600 420"/><path d="M576 402 L600 420 L576 438"/>
        </g>
        <rect x="80" y="480" width="640" height="8" rx="4" fill="#100F0D" opacity=".2"/>
      </svg>
