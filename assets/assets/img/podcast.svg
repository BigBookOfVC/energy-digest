<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A conversation as a waveform">
  <defs>
    <linearGradient id="pod-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CC6F"/>
      <stop offset=".5" stop-color="#12756E"/>
      <stop offset="1" stop-color="#0B3F4A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pod-g)"/>

  <!-- one voice, then the other -->
  <g stroke="#100F0D" stroke-width="14" stroke-linecap="round" opacity=".28">
    <line x1="72"  y1="272" x2="72"  y2="328"/>
    <line x1="112" y1="238" x2="112" y2="362"/>
    <line x1="152" y1="186" x2="152" y2="414"/>
    <line x1="192" y1="256" x2="192" y2="344"/>
    <line x1="232" y1="150" x2="232" y2="450"/>
    <line x1="272" y1="214" x2="272" y2="386"/>
    <line x1="312" y1="264" x2="312" y2="336"/>
  </g>
  <g stroke="#F7EFE7" stroke-width="14" stroke-linecap="round" opacity=".82">
    <line x1="488" y1="216" x2="488" y2="384"/>
    <line x1="528" y1="160" x2="528" y2="440"/>
    <line x1="568" y1="246" x2="568" y2="354"/>
    <line x1="608" y1="188" x2="608" y2="412"/>
    <line x1="648" y1="262" x2="648" y2="338"/>
    <line x1="688" y1="222" x2="688" y2="378"/>
    <line x1="728" y1="278" x2="728" y2="322"/>
  </g>

  <!-- the mic between them -->
  <g transform="translate(400 300)">
    <circle r="74" fill="#100F0D" opacity=".9"/>
    <rect x="-15" y="-36" width="30" height="46" rx="15" fill="#F7EFE7"/>
    <path d="M-26 6a26 26 0 0 0 52 0" fill="none" stroke="#F7EFE7" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="0" y2="44" stroke="#F7EFE7" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
