        <rect x="612" y="150" width="66" height="300" rx="8" fill="#F7EFE7" opacity=".62"/>
        <rect x="612" y="150" width="66" height="96" rx="8" fill="#100F0D" opacity=".38"/>
        <rect x="706" y="246" width="66" height="204" rx="8" fill="#F7EFE7" opacity=".62"/>
        <rect x="596" y="466" width="192" height="4" rx="2" fill="#100F0D" opacity=".3"/>
