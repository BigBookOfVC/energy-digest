<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cooling coil serpentine running through a building, with the wasted share of the load cut away" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs><linearGradient id="nobody-buys-efficiency-so-he-sold-g10" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9CC6F"/><stop offset=".5" stop-color="#D99114"/>
          <stop offset="1" stop-color="#12756E"/></linearGradient></defs>
        <rect width="800" height="600" fill="url(#nobody-buys-efficiency-so-he-sold-g10)"/>
        <!-- the building the load sits in -->
        <rect x="52" y="96" width="232" height="424" rx="10" fill="#100F0D" opacity=".18"/>
        <g fill="#F7EFE7" opacity=".34">
          <rect x="84" y="132" width="48" height="34" rx="4"/><rect x="148" y="132" width="48" height="34" rx="4"/>
          <rect x="212" y="132" width="40" height="34" rx="4"/>
          <rect x="84" y="192" width="48" height="34" rx="4"/><rect x="148" y="192" width="48" height="34" rx="4"/>
          <rect x="212" y="192" width="40" height="34" rx="4"/>
          <rect x="84" y="252" width="48" height="34" rx="4"/><rect x="212" y="252" width="40" height="34" rx="4"/>
        </g>
